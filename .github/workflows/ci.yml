name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Regenerate the lockfile on the runner before installing (npm/cli#4828).
      # The committed `package-lock.json` is generated on the maintainer's
      # machine (macOS / Windows). It declares every platform's rollup binary
      # as an available optional dep, but only records the host platform's
      # binary as actually resolved in `node_modules/...`. `npm ci` and
      # `npm install` both follow the lockfile literally, so on a Linux
      # runner they skip the Linux rollup binary that vitest needs and
      # fail at startup with "Cannot find module @rollup/rollup-linux-x64-gnu".
      # Removing the lockfile forces npm to resolve fresh for the runner's
      # platform. Trade-off: lockfile becomes advisory; supply-chain
      # signature verification still runs in the next step.
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      # Supply-chain gate. Runs before functional checks so a PR that
      # introduces a known-vulnerable runtime dep, or a tampered package
      # whose npm-registry signature doesn't verify, fails fast.
      #
      # `--omit=dev` ignores dev-only deps (vitest, eslint, prettier, ...);
      # those don't ship to users and are tracked separately by Dependabot.
      # `--audit-level=high` matches the threshold a security-positioned
      # tool should not regress past. Moderate dev-dep vulns are still
      # surfaced by `npm audit` locally and by Dependabot's weekly PR
      # cadence.
      - name: Supply-chain audit (runtime deps)
        run: npm audit --audit-level=high --omit=dev

      # Verifies every installed package's npm-registry signature and any
      # provenance attestation. Catches a compromised registry / tampered
      # tarball; complements `npm audit` (which only catches *known* CVEs).
      - name: Supply-chain audit (registry signatures)
        run: npm audit signatures

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit + integration tests
        run: npm test

      - name: Validate bundled lenses (static)
        run: npm run validate:lenses

      - name: Build
        run: npm run build
