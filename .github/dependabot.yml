version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      runtime-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    # Major-version bumps (typescript 5→6, vitest 2→4, eslint 9→10, zod 3→4,
    # better-sqlite3 11→12, etc.) are evaluated manually as deliberate
    # one-at-a-time PRs. Auto-grouped majors are too risky to take blind:
    # zod 4 has breaking type-inference changes, vitest 4 has reporter API
    # changes, and the test suite needs explicit verification per major.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    # Same policy for action majors (e.g. actions/checkout v4→v6). The
    # Node 20 deprecation warning these bumps fix has a Sept 2026 deadline,
    # so a manual upgrade post-launch is fine.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
