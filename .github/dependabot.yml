version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      # Without `day`, Dependabot defaults to Monday. Friday morning keeps
      # dependency review off the start of the week.
      day: "friday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    # Targeted ignores for major-version bumps that have been evaluated
    # and require dedicated migration work, not a drive-by upgrade.
    ignore:
      # Zod 4 is supported. Keep future major versions behind a dedicated
      # compatibility review of the exported schemas and error API.
      - dependency-name: zod
        update-types:
          - version-update:semver-major

      # Vitest 5 requires Node 22.12 or newer and drops Node 20, which
      # JanuScope still supports and tests. Stay on Vitest 4 until Node 20
      # support is intentionally retired.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      # Without `day`, Dependabot defaults to Monday. Friday morning keeps
      # dependency review off the start of the week.
      day: "friday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
