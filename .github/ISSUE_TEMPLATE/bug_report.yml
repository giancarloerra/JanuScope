name: Bug report
description: Report something in JanuScope that isn't working as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please complete the sections below so we can reproduce
        the issue. For security-sensitive findings (a `block` rule that doesn't block,
        a `redact` rule that leaks, an `audit` log that misses events), please use the
        private channel in [SECURITY.md](https://github.com/giancarloerra/januscope/blob/main/SECURITY.md)
        instead of this template.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Describe the incorrect behaviour. Name the lens or overlay involved.
      placeholder: |
        When I run JanuScope wrapped around <postgres-mcp / redis-mcp-server / ...>
        with the bundled <lens> and call <tool>, I expected <X> but got <Y>.
    validations:
      required: true

  - type: textarea
    id: minimal_config
    attributes:
      label: Minimal config
      description: |
        Paste the relevant part of your `config.yaml`, with credentials redacted.
        Smaller is better — strip everything not needed to reproduce.
      render: yaml
      placeholder: |
        target:
          command: uvx
          args: ["postgres-mcp", "--access-mode=restricted"]
          env:
            DATABASE_URI: "${DATABASE_URL}"
        block:
          - execute_sql
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs actual
      description: One sentence each.
      placeholder: |
        Expected: tool call returns -32601 because `execute_sql` is in `block`.
        Actual: tool call is forwarded to the MCP and runs.
    validations:
      required: true

  - type: input
    id: januscope_version
    attributes:
      label: JanuScope version
      description: Output of `januscope --version` (or your installed npm version / commit SHA).
      placeholder: "0.3.0"
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v22.10.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14.5 / Ubuntu 22.04 / Windows 11"
    validations:
      required: true

  - type: input
    id: target_mcp
    attributes:
      label: Target MCP and version
      description: Which MCP is JanuScope wrapping, and what version?
      placeholder: "postgres-mcp 0.4.2 (uvx)"

  - type: textarea
    id: logs
    attributes:
      label: Logs and extra context
      description: |
        Paste relevant lines from JanuScope's stderr (the `[januscope:<overlay>]`
        prefixed ones), or the JSON-RPC messages around the failure. Audit log
        excerpts are also useful.
      render: shell
