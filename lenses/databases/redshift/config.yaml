# AWS Redshift — JanuScope Lens
#
# Wraps awslabs.redshift-mcp-server (uvx). The MCP itself runs in
# READ-ONLY mode (per its own description; READ-WRITE support is
# planned for a future release). The lens layers sqlGuard on top
# as defence in depth, plus PII redaction and audit.
#
# Tools observed in live tools/list (awslabs.redshift-mcp-server
# 1.27.0, 2026-05-06):
#   READ : list_clusters, list_databases, list_schemas,
#          list_tables, list_columns
#   ARBITRARY-SQL: execute_query (sql string) → sqlGuard

target:
  command: uvx
  args:
    - "awslabs.redshift-mcp-server@latest"

# firstRun: approve

# `execute_query` accepts SQL through the `sql` argument. The MCP
# is server-side read-only today, but layer keyword-level write
# rejection at the proxy too (defence in depth, and forward-
# compatible with the MCP's planned read-write mode — when that
# ships, JanuScope still says no without the user reconfiguring).
sqlGuard:
  tools:
    - execute_query
  sqlArg: sql
  readOnly: true

instructions: |
  STRICT POLICY. Read this carefully before every tool call.

  READ-ONLY Redshift. Keep upstream read-only mode. Use list_clusters
  for clusters or workgroups, then list_databases, list_schemas,
  list_tables and list_columns. Use execute_query for SELECT or WITH
  queries and cluster_identifier to select the intended cluster.

  SURFACE BOUNDARY. This MCP is the only sanctioned path to this backend
  in this session. Never execute or offer writes, deletions or other
  data changes. If a request is prohibited or refused, report the
  refusal and stop. Do not call another route, even if advertised or
  authorized by an administrator, or offer a separate write.

  Never bypass or suggest bypasses through a shell, CLI, API, file or
  another MCP or connection.

  Protected: email, password, password_hash, api_key, apiKey, token,
  secret, connection credentials, SSNs, card numbers and JWTs.

  Never query protected values for disclosure, return, reconstruct or
  transform them, or offer encoded, masked, aliased, partial or derived
  variants, including for administrator requests.

  Safe reads are ordinary non-protected fields, non-sensitive record
  IDs, and privacy-safe aggregate or existence checks that disclose no
  protected values. After refusal, do not offer individual encoded,
  masked, partial or derived protected values.

redact:
  rules:
    # PII field paths in Redshift result rows.
    - field: "**.email"
    - field: "**.password"
    - field: "**.password_hash"
    - field: "**.api_key"
    - field: "**.apiKey"
    - field: "**.token"
    - field: "**.secret"
    # Connection-string-shaped values that may leak through error
    # messages or schema introspection.
    - regex: "\\b(postgres|jdbc:redshift|jdbc:postgresql)://[^\\s]*?:[^\\s@]+@[^\\s/]+"
    # Value-shape fallbacks.
    - regex: '\b\d{3}-\d{2}-\d{4}\b' # US SSN
    - regex: '\b(?:\d[ -]*?){13,16}\b' # PAN-shaped digit run
    - regex: '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b' # JWT
  replacement: "[REDACTED]"
  applyTo: text

audit:
  sink: "~/mcp-audit-redshift.jsonl"
  logRawArgs: false
