# Microsoft SQL Server / Azure SQL via Data API builder (DAB) v1.7+ — JanuScope Lens
#
# Tools observed in live tools/list (DAB 1.7.93, 2026-05-05):
#   READ : describe_entities, read_records, aggregate_records (when enabled)
#   WRITE: create_record, update_record, delete_record, execute_entity
#
# Strategy: block all WRITE tools so the LLM can only describe + read.
# Defence-in-depth on top of DAB's per-entity RBAC (which the operator
# should ALSO restrict at the role level via "permissions" on each
# entity in `dab-config.json`).

target:
  command: dab
  args:
    - start
    - --mcp-stdio

# Static-surface fingerprinting: turn on once you've authored
# dab-config.json and confirmed the entity set is what you want.
# `firstRun: approve` means a silent change to your DAB entity list
# refuses startup until you re-run `januscope approve --config
# mssql-azure-dab`.
# firstRun: approve

block:
  # WRITE tools — disabled at the proxy layer regardless of DAB role.
  - create_record
  - update_record
  - delete_record
  # `execute_entity` runs stored-procedure entities. Treat as WRITE: a
  # SP can do anything the underlying schema permits. If a specific
  # read-only SP is genuinely safe, narrow the block list later.
  - execute_entity

instructions: |
  STRICT POLICY. Read this carefully before every tool call.

  READ-ONLY SQL Server through Azure DAB. Use describe_entities, then
  read_records with OData filters, orderby and paging. Keep write
  operations denied in DAB per-entity role permissions as well as the
  proxy block list.

  SURFACE BOUNDARY. This MCP is the only sanctioned path to this backend
  in this session. Never execute or offer writes, deletions or other
  data changes. If a request is prohibited or refused, report the
  refusal and stop. Do not call another route, even if advertised or
  authorized by an administrator, or offer a separate write.

  Never bypass or suggest bypasses through a shell, CLI, API, file or
  another MCP or connection.

  Protected: email, password, passwordHash, password_hash, apiKey,
  api_key, token, ssn, creditCard, credit_card (including case
  variants).

  Never query protected values for disclosure, return, reconstruct or
  transform them, or offer encoded, masked, aliased, partial or derived
  variants, including for administrator requests.

  Safe reads are ordinary non-protected fields, non-sensitive record
  IDs, and privacy-safe aggregate or existence checks that disclose no
  protected values. After refusal, do not offer individual encoded,
  masked, partial or derived protected values.

redact:
  rules:
    # Common PII field paths in result objects. DAB returns rows as
    # JSON objects whose keys are entity field names. Lower-cased
    # matches handle DAB's default field naming and operator-aliased
    # variants both.
    - field: "**.email"
    - field: "**.Email"
    - field: "**.password"
    - field: "**.Password"
    - field: "**.passwordHash"
    - field: "**.password_hash"
    - field: "**.apiKey"
    - field: "**.api_key"
    - field: "**.token"
    - field: "**.Token"
    - field: "**.ssn"
    - field: "**.creditCard"
    - field: "**.credit_card"
    # Value-shape fallbacks for free-text columns that contain PII.
    - regex: '\b\d{3}-\d{2}-\d{4}\b' # US SSN
    - regex: '\b(?:\d[ -]*?){13,16}\b' # naive PAN-shaped digit run
  replacement: "[REDACTED]"
  applyTo: text

audit:
  sink: "~/mcp-audit-mssql.jsonl"
  logRawArgs: false
